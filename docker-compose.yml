# اجرا روی سرور:  cp .env.example .env  (و پر کردن مقادیر)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enodigital
      POSTGRES_USER: enodigital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env تعیین کنید}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enodigital -d enodigital"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL:?APP_URL را در .env تعیین کنید}
        NEXT_PUBLIC_FORM_ENDPOINT: ${NEXT_PUBLIC_FORM_ENDPOINT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://enodigital:${POSTGRES_PASSWORD}@db:5432/enodigital
    depends_on:
      db:
        condition: service_healthy
    # پشت Nginx/Caddy با HTTPS قرار دهید؛ فقط روی localhost باز است
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
