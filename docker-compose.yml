# اجرا روی سرور:  cp .env.example .env  (و پر کردن مقادیر)  →  docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: enodigital
      MYSQL_USER: enodigital
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD را در .env تعیین کنید}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uenodigital -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?APP_URL را در .env تعیین کنید}
        NEXT_PUBLIC_FORM_ENDPOINT: ${NEXT_PUBLIC_FORM_ENDPOINT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://enodigital:${DB_PASSWORD}@db:3306/enodigital
    depends_on:
      db:
        condition: service_healthy
    # پشت Nginx/Caddy با HTTPS قرار دهید؛ فقط روی localhost باز است
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  dbdata:
